# Every push and pull request: type check, lint, unit tests, browser tests and
# the LAN rehearsal on the production build. Windows, like the host PC, so the
# monitors are laid out with the same fonts.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the test browser
        run: npx playwright install chromium

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:ui

      - name: LAN rehearsal (production build)
        run: npm run test:lan

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
